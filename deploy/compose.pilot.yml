# One active producer per existing PostgreSQL slot. Use external managed NATS
# for replicated production durability, or mount durable storage on every broker.
services:
  cdc:
    image: ${CDC_IMAGE:-better-cdc:pilot}
    build:
      context: ..
    restart: on-failure
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    ports: ["127.0.0.1:8080:8080"]
    env_file: ${CDC_ENV_FILE:-./pilot.env}
    environment:
      SPILL_DIR: /var/lib/better-cdc/spill
      CDC_PLUGIN: pgoutput
      PUBLISH_FAILURE_POLICY: dlq
      UNSAFE_UNORDERED_ASYNC_PUBLISH: "false"
      RAW_MESSAGE_BUFFER_BYTES: "67108864"
      PARSED_EVENT_BUFFER_BYTES: "67108864"
      MAX_TX_BUFFER_BYTES: "67108864"
      MAX_SPILL_BYTES: "1073741824"
    volumes:
      - spill:/var/lib/better-cdc/spill
      - ${CDC_SECRETS_DIR:-./secrets}:/run/secrets:ro
volumes:
  spill:
